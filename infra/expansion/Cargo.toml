[package]
name = "cnamaste_expansion"
version = "0.1.0"
edition = "2021"
description = "cnamaste's Potts alpha expansion, each move a Boykov-Kolmogorov min s-t cut, behind a C entry point."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
